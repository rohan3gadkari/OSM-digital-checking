<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On-Screen Evaluation System</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        .container { display: flex; height: 100vh; }
        .pdf-panel { width: 70%; border-right: 3px solid #333; background-color: #525659; }
        .marks-panel { width: 30%; padding: 25px; background-color: #f4f4f9; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
        .form-group { margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        .total-box { background-color: #e2f0d9; padding: 15px; border: 2px dashed #385723; border-radius: 6px; text-align: center; margin-bottom: 20px; }
        .total-box h3 { margin: 0; color: #385723; font-size: 20px; }
        button { width: 100%; padding: 12px; background-color: #2b7a78; color: white; border: none; font-size: 16px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background-color: #17252a; }
        #msg { text-align: center; font-weight: bold; margin-top: 10px; display: none; }
        .success { color: green; }
    </style>
</head>
<body>

<div class="container">
    <div class="pdf-panel">
        <iframe src="{{ url_for('static', filename='answer_sheets/' + paper_file) }}" width="100%" height="100%" style="border:none;"></iframe>
    </div>

    <div class="marks-panel">
        <div>
            <h2>Test Series Marking Panel</h2>
            <hr><br>
            
            <form id="marksForm">
                <div class="form-group">
                    <label>Question 1 Marks (Max 10):</label>
                    <input type="number" id="q1" min="0" max="10" required value="0" oninput="calculateLiveTotal()">
                </div>
                <div class="form-group">
                    <label>Question 2 Marks (Max 10):</label>
                    <input type="number" id="q2" min="0" max="10" required value="0" oninput="calculateLiveTotal()">
                </div>
            </form>
        </div>

        <div>
            <div class="total-box">
                <h3>Live Total: <span id="liveTotal">0</span> / 20</h3>
            </div>
            
            <button type="button" onclick="submitMarksViaAJAX()">Submit & Save Marks</button>
            <div id="msg"></div>
        </div>
    </div>
</div>

<script>
    // १. Live Total काढण्यासाठी फंक्शन
    function calculateLiveTotal() {
        let q1 = parseInt(document.getElementById('q1').value) || 0;
        let q2 = parseInt(document.getElementById('q2').value) || 0;
        document.getElementById('liveTotal').innerText = q1 + q2;
    }

    // २. पेज रिफ्रेश न करता डेटा बॅकएंडला (Excel मध्ये) पाठवण्यासाठी फंक्शन
    function submitMarksViaAJAX() {
        let q1Value = document.getElementById('q1').value;
        let q2Value = document.getElementById('q2').value;
        
        if(q1Value === "" || q2Value === "") {
            alert("कृपया सर्व रकान्यांमध्ये गुण भरा!");
            return;
        }

        let dataToSend = {
            paper_file: "{{ paper_file }}",
            q1: q1Value,
            q2: q2Value
        };

        fetch('/submit_marks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dataToSend)
        })
        .then(response => response.json())
        .then(data => {
            if(data.status === 'success') {
                let msgDiv = document.getElementById('msg');
                msgDiv.innerHTML = "<p class='success'>✔️ गुण Excel मध्ये यशस्वीरीत्या सेव्ह झाले!</p>";
                msgDiv.style.display = 'block';
                
                // ३ सेकंदांनंतर मेसेज लपवणे
                setTimeout(() => { msgDiv.style.display = 'none'; }, 3000);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("गुण सेव्ह करताना काहीतरी अडचण आली!");
        });
    }
</script>

</body>
</html>
