<h4 style="margin: 10px 0 2px 0; color: #1e293b;">📋 Evaluation Matrix</h4>
<div class="info-tip">💡 Click a data cell entry field, then use the keypad on the left to enter grades.</div>

<form id="marksForm" style="margin-top: 8px;">
    <table class="marks-table">
        <thead>
            <tr>
                <th>Q.No</th>
                <th>Max</th>
                <th>Score Given</th>
            </tr>
        </thead>
        <tbody>
            {% for q in structure %}
            <tr id="row-{{ q.id }}">
                <td><strong>{{ q.label }}</strong></td>
                <td>{{ q.max }}</td>
                <td>
                    <input type="number" 
                           id="{{ q.id }}" 
                           class="mark-input"
                           min="0" 
                           max="{{ q.max }}" 
                           value="0" 
                           onfocus="setActiveQuestion('{{ q.id }}')" 
                           oninput="calculateLiveTotal()">
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</form>

<div>
    <div class="total-box">
        <h3>Total Score: <span id="liveTotal">0</span> / {{ total_max }}</h3>
    </div>
    <button type="button" class="btn-submit" onclick="submitMarksViaAJAX()">Finish & Save Score</button>
    <div class="nav-buttons">
        <button class="btn-nav" onclick="navigatePaper('prev')">⬅️ Prev Paper</button>
        <button class="btn-nav" onclick="navigatePaper('next')">Next Paper ➡️</button>
    </div>
    <div id="msg"></div>
</div>
