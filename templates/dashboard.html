<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On-Screen Evaluation System</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background-color: #f0f2f5; }
        .container { display: flex; height: 100vh; }
        .pdf-panel { width: 70%; border-right: 3px solid #333; background-color: #525659; position: relative; }
        .marks-panel { width: 30%; padding: 25px; background-color: #ffffff; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; box-shadow: -2px 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #333; }
        input[type="number"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; transition: 0.3s; }
        input[type="number"]:focus { border-color: #2b7a78; outline: none; }
        .total-box { background-color: #e2f0d9; padding: 15px; border: 2px dashed #385723; border-radius: 6px; text-align: center; margin-bottom: 15px; }
        .total-box h3 { margin: 0; color: #385723; font-size: 22px; }
        .btn-submit { width: 100%; padding: 14px; background-color: #2b7a78; color: white; border: none; font-size: 16px; cursor: pointer; border-radius: 6px; font-weight: bold; margin-bottom: 10px; }
        .btn-submit:hover { background-color: #17252a; }
        .nav-buttons { display: flex; gap: 10px; }
        .btn-nav { flex: 1; padding: 10px; background-color: #def2f1; color: #2b7a78; border: 1px solid #2b7a78; font-weight: bold; cursor: pointer; border-radius: 6px; }
        .btn-nav:hover { background-color: #2b7a78; color: white; }
        #msg { text-align: center; font-weight: bold; margin-top: 10px; display: none; padding: 8px; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .paper-info { background-color: #17252a; color: white; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="pdf-panel">
        <iframe id="pdfFrame" src="{{ url_for('static', filename='answer_sheets/' + current_paper) }}" width="100%" height="100%" style="border:none;"></iframe>
    </div>

    <div class="marks-panel">
        <div>
            <h2>OSM Evaluation Panel</h2>
            <hr><br>
            
            <div class="paper-info">
                📄 Current Paper: <span id="paperName">{{ current_paper }}</span>
            </div>
            
            <form id="marksForm">
                <div class="form-group"><label>Q1 Marks (Max 5):</label><input type="number" id="q1" min="0" max="5" value="0" oninput="calculateLiveTotal()"></div>
                <div class="form-group"><label>Q2 Marks (Max 5):</label><input type="number" id="q2" min="0" max="5" value="0" oninput="calculateLiveTotal()"></div>
                <div class="form-group"><label>Q3 Marks (Max 5):</label><input type="number" id="q3" min="0" max="5" value="0" oninput="calculateLiveTotal()"></div>
                <div class="form-group"><label>Q4 Marks (Max 5):</label><input type="number" id="q4" min="0" max="5" value="0" oninput="calculateLiveTotal()"></div>
            </form>
        </div>

        <div>
            <div class="total-box">
                <h3>Live Total: <span id="liveTotal">0</span> / 20</h3>
            </div>
            
            <button type="button" class="btn-submit" onclick="submitMarksViaAJAX()">Save & Submit Marks</button>
            
            <div class="nav-buttons">
                <button class="btn-nav" onclick="navigatePaper('prev')">⬅️ Previous</button>
                <button class="btn-nav" onclick="navigatePaper('next')">Next ➡️</button>
            </div>
            
            <div id="msg"></div>
        </div>
    </div>
</div>

<script>
    function calculateLiveTotal() {
        let q1 = parseInt(document.getElementById('q1').value) || 0;
        let q2 = parseInt(document.getElementById('q2').value) || 0;
        let q3 = parseInt(document.getElementById('q3').value) || 0;
        let q4 = parseInt(document.getElementById('q4').value) || 0;
        document.getElementById('liveTotal').innerText = q1 + q2 + q3 + q4;
    }

    function submitMarksViaAJAX() {
        let dataToSend = {
            paper_file: document.getElementById('paperName').innerText,
            q1: document.getElementById('q1').value || 0,
            q2: document.getElementById('q2').value || 0,
            q3: document.getElementById('q3').value || 0,
            q4: document.getElementById('q4').value || 0
        };

        fetch('/submit_marks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dataToSend)
        })
        .then(response => response.json())
        .then(data => {
            if(data.status === 'success') {
                let msgDiv = document.getElementById('msg');
                msgDiv.className = "success";
                msgDiv.innerHTML = "✔️ गुण Excel मध्ये यशस्वीरीत्या सेव्ह झाले!";
                msgDiv.style.display = 'block';
                setTimeout(() => { msgDiv.style.display = 'none'; }, 3000);
            }
        });
    }

    function navigatePaper(direction) {
        let currentPaper = document.getElementById('paperName').innerText;
        window.location.href = `/navigate?current=${currentPaper}&direction=${direction}`;
    }
</script>

</body>
</html>
