<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced On-Screen Evaluation System</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; }
        
        /* 🔝 टॉप हेडर बार */
        .header-bar { background-color: #1a252f; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .header-bar h2 { margin: 0; font-size: 18px; letter-spacing: 0.5px; }
        .user-info { font-size: 14px; color: #bdc3c7; }
        .user-info a { color: #e74c3c; text-decoration: none; font-weight: bold; margin-left: 10px; border: 1px solid #e74c3c; padding: 3px 8px; border-radius: 4px; }
        .user-info a:hover { background-color: #e74c3c; color: white; }

        .container { display: flex; height: calc(100vh - 45px); }

        /* 🖌️ डावा टूलबार (Annotation Tools) */
        .toolbar { width: 50px; background-color: #2c3e50; display: flex; flex-direction: column; align-items: center; padding-top: 15px; gap: 12px; border-right: 1px solid #34495e; }
        .tool-btn { width: 36px; height: 36px; border-radius: 50%; border: none; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; background-color: #ecf0f1; }
        .tool-btn:hover { transform: scale(1.1); }
        .tool-tick { background-color: #2ecc71; color: white; }
        .tool-cross { background-color: #e74c3c; color: white; }
        .tool-text { background-color: #3498db; color: white; }
        .tool-undo { background-color: #f1c40f; color: black; }

        /* 📄 मधला PDF पॅनल */
        .pdf-panel { flex: 1; background-color: #7f8c8d; position: relative; display: flex; flex-direction: column; }
        .paper-bar { background-color: #34495e; color: white; padding: 6px; text-align: center; font-weight: bold; font-size: 14px; }

        /* 📊 उजवा मार्किंग पॅनल (Table Format) */
        .marks-panel { width: 320px; background-color: #ffffff; padding: 15px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; box-shadow: -2px 0 10px rgba(0,0,0,0.1); }
        
        .upload-section { background-color: #f8f9fa; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 12px; }
        .upload-section h4 { margin: 0 0 6px 0; color: #2c3e50; font-size: 13px; }
        input[type="file"] { font-size: 12px; width: 100%; }
        .btn-upload { background-color: #2c3e50; color: white; border: none; padding: 5px; font-size: 12px; cursor: pointer; border-radius: 4px; width: 100%; margin-top: 5px; font-weight: bold; }

        /* 📋 गुण टाकण्याचे टेबल */
        .marks-table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        .marks-table th, .marks-table td { border: 1px solid #cbd5e1; padding: 8px; text-align: center; font-size: 14px; }
        .marks-table th { background-color: #f1f5f9; color: #334155; }
        .marks-table input[type="number"] { width: 55px; padding: 5px; text-align: center; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 14px; font-weight: bold; }

        .total-box { background-color: #ecfdf5; padding: 12px; border: 1px solid #a7f3d0; border-radius: 6px; text-align: center; margin-bottom: 10px; }
        .total-box h3 { margin: 0; color: #065f46; font-size: 18px; }
        
        .btn-submit { width: 100%; padding: 12px; background-color: #10b981; color: white; border: none; font-size: 15px; cursor: pointer; border-radius: 6px; font-weight: bold; margin-bottom: 8px; box-shadow: 0 2px 4px rgba(16,185,129,0.3); }
        .btn-submit:hover { background-color: #059669; }
        
        .nav-buttons { display: flex; gap: 8px; }
        .btn-nav { flex: 1; padding: 8px; background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; font-weight: bold; cursor: pointer; border-radius: 6px; font-size: 13px; }
        .btn-nav:hover { background-color: #cbd5e1; }
        
        #msg, #uploadMsg { text-align: center; font-weight: bold; margin-top: 5px; display: none; padding: 6px; border-radius: 4px; font-size: 13px; }
        .success { background-color: #d1fae5; color: #065f46; }
        .error { background-color: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div class="header-bar">
    <h2>On-Screen Marking (OSM) Platform</h2>
    <div class="user-info">
        👤 Evaluator: <strong>{{ user }}</strong>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="container">
    
    <div class="toolbar">
        <button class="tool-btn tool-tick" title="Correct">✔️</button>
        <button class="tool-btn tool-cross" title="Wrong">❌</button>
        <button class="tool-btn tool-text" title="Add Comment">💬</button>
        <button class="tool-btn tool-undo" title="Undo">↩️</button>
    </div>

    <div class="pdf-panel">
        <div class="paper-bar">📄 Active Answer Sheet: <span id="paperName">{{ current_paper }}</span></div>
        <iframe id="pdfFrame" src="{{ url_for('static', filename='answer_sheets/' + current_paper) }}" width="100%" height="100%" style="border:none;"></iframe>
    </div>

    <div class="marks-panel">
        <div>
            <div class="upload-section">
                <h4>📁 Upload Answer Sheet (.pdf)</h4>
                <form id="uploadForm" enctype="multipart/form-data">
                    <input type="file" id="pdfFile" name="file" accept=".pdf" required>
                    <button type="button" class="btn-upload" onclick="uploadPDFViaAJAX()">Upload PDF</button>
                </form>
                <div id="uploadMsg"></div>
            </div>

            <h4 style="margin: 10px 0 5px 0; color: #1e293b;">📋 Evaluation Matrix</h4>
            
            <form id="marksForm">
                <table class="marks-table">
                    <thead>
                        <tr>
                            <th>Q.No</th>
                            <th>Max</th>
                            <th>Score Given</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><strong>Q1</strong></td>
                            <td>5</td>
                            <td><input type="number" id="q1" min="0" max="5" value="0" oninput="calculateLiveTotal()"></td>
                        </tr>
                        <tr>
                            <td><strong>Q2</strong></td>
                            <td>5</td>
                            <td><input type="number" id="q2" min="0" max="5" value="0" oninput="calculateLiveTotal()"></td>
                        </tr>
                        <tr>
                            <td><strong>Q3</strong></td>
                            <td>5</td>
                            <td><input type="number" id="q3" min="0" max="5" value="0" oninput="calculateLiveTotal()"></td>
                        </tr>
                        <tr>
                            <td><strong>Q4</strong></td>
                            <td>5</td>
                            <td><input type="number" id="q4" min="0" max="5" value="0" oninput="calculateLiveTotal()"></td>
                        </tr>
                    </tbody>
                </table>
            </form>
        </div>

        <div>
            <div class="total-box">
                <h3>Total Score: <span id="liveTotal">0</span> / 20</h3>
            </div>
            
            <button type="button" class="btn-submit" onclick="submitMarksViaAJAX()">Finish & Save Score</button>
            
            <div class="nav-buttons">
                <button class="btn-nav" onclick="navigatePaper('prev')">⬅️ Prev Paper</button>
                <button class="btn-nav" onclick="navigatePaper('next')">Next Paper ➡️</button>
            </div>
            
            <div id="msg"></div>
        </div>
    </div>
</div>

<script>
    function calculateLiveTotal() {
        let q1 = parseInt(document.getElementById('q1').value) || 0;
        let q2 = parseInt(document.getElementById('q2').value) || 0;
        let q3 = parseInt(document.getElementById('q3').value) || 0;
        let q4 = parseInt(document.getElementById('q4').value) || 0;
        document.getElementById('liveTotal').innerText = q1 + q2 + q3 + q4;
    }

    function uploadPDFViaAJAX() {
        let fileInput = document.getElementById('pdfFile');
        let msgDiv = document.getElementById('uploadMsg');
        
        if (fileInput.files.length === 0) {
            alert("कृपया आधी एक PDF फाईल निवडा!");
            return;
        }

        let formData = new FormData();
        formData.append("file", fileInput.files[0]);

        msgDiv.style.display = 'block';
        msgDiv.className = "";
        msgDiv.innerText = "अपलोड होत आहे...";

        fetch('/upload_paper', { method: 'POST', body: formData })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                msgDiv.className = "success";
                msgDiv.innerText = "✔️ यशस्वी अपलोड!";
                setTimeout(() => { window.location.href = "/?paper=" + data.filename; }, 1500);
            } else {
                msgDiv.className = "error";
                msgDiv.innerText = "❌ " + data.message;
            }
        });
    }

    function submitMarksViaAJAX() {
        let dataToSend = {
            paper_file: document.getElementById('paperName').innerText,
            q1: document.getElementById('q1').value || 0,
            q2: document.getElementById('q2').value || 0,
            q3: document.getElementById('q3').value || 0,
            q4: document.getElementById('q4').value || 0
        };

        fetch('/submit_marks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dataToSend)
        })
        .then(response => response.json())
        .then(data => {
            if(data.status === 'success') {
                let msgDiv = document.getElementById('msg');
                msgDiv.className = "success";
                msgDiv.innerHTML = "✔️ गुण सुरक्षित सेव्ह झाले!";
                msgDiv.style.display = 'block';
                setTimeout(() => { msgDiv.style.display = 'none'; }, 3000);
            }
        });
    }

    function navigatePaper(direction) {
        let currentPaper = document.getElementById('paperName').innerText;
        window.location.href = `/navigate?current=${currentPaper}&direction=${direction}`;
    }
</script>

</body>
</html>
