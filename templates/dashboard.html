<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional OSM Workspace</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        /* 🏢 IndiaMART स्टाईल टॉप हेडर बार */
        .top-navbar {
            background: #2c3e50; color: white; padding: 0 20px;
            display: flex; justify-content: space-between; align-items: center; height: 55px;
            border-bottom: 3px solid #34495e; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .top-navbar h3 { font-size: 15px; font-weight: 600; letter-spacing: 0.5px; }
        .meta-container { display: flex; align-items: center; gap: 15px; }
        .barcode-badge { background: #e67e22; color: white; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 13px; }
        .lock-status-banner { background: #e74c3c; color: white; padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; display: none; }
        
        .osm-container { display: flex; height: calc(100vh - 55px); overflow: hidden; background: #f1f5f9; }

        /* 🎛️ डावा की-पॅड पॅनेल (Eklavya/IndiaMART लेआउट) */
        .tool-sidebar {
            width: 75px; background: #1e293b; padding: 15px 5px;
            display: flex; flex-direction: column; align-items: center; gap: 10px; border-right: 1px solid #0f172a;
        }
        .tool-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; font-weight: bold; }
        .circle-key {
            width: 46px; height: 46px; border-radius: 50%; border: none;
            background: #f8fafc; color: #1e293b; font-size: 18px; font-weight: 700;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15); transition: all 0.15s ease;
        }
        .circle-key:hover { background: #38bdf8; color: white; transform: translateY(-2px); }
        .clear-btn { background: #ef4444; color: white; font-size: 12px; }
        .clear-btn:hover { background: #dc2626; }

        /* 📄 मधला आन्सर शीट डिस्प्ले एरिया */
        .pdf-viewer-container { flex: 1; background: #64748b; padding: 15px; display: flex; justify-content: center; overflow-y: auto; }
        .pdf-canvas { width: 100%; max-width: 850px; background: white; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border-radius: 6px; overflow: hidden; }

        /* 📊 उजवा मार्किंग मॅट्रिक्स पॅनेल */
        .evaluation-panel { width: 360px; background: white; border-left: 1px solid #cbd5e1; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .panel-title { font-size: 13px; color: #334155; border-bottom: 2px solid #cbd5e1; padding-bottom: 8px; margin-bottom: 12px; font-weight: bold; text-transform: uppercase; }
        
        /* 📜 स्क्रोलिंग टेबल */
        .table-scroll { overflow-y: auto; flex-grow: 1; max-height: calc(100vh - 310px); border: 1px solid #cbd5e1; border-radius: 6px; }
        .marks-table { width: 100%; border-collapse: collapse; text-align: center; font-size: 14px; }
        .marks-table th { background: #475569; color: white; padding: 10px 8px; font-weight: 600; position: sticky; top: 0; z-index: 10; font-size: 12px; }
        .marks-table td { padding: 6px; border: 1px solid #e2e8f0; }
        
        /* इनपुट बॉक्स */
        .mark-input { width: 65px; text-align: center; border: 1.5px solid #cbd5e1; border-radius: 4px; padding: 5px; font-size: 14px; font-weight: bold; color: #1e293b; background: #f8fafc; }
        .mark-input:focus { outline: none; border-color: #3b82f6; background: #fff; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        
        .max-editable-input { width: 55px; text-align: center; border: 1.5px solid #fbcfe8; border-radius: 4px; padding: 5px; font-size: 13px; font-weight: bold; color: #b45309; background: #fffbeb; }
        .max-editable-input:focus { outline: none; border-color: #f59f00; background: #fff; }
        
        .active-row { background: #fef08a !important; }

        /* 💾 तळाचे ॲक्शन कंट्रोल्स */
        .action-section { margin-top: 15px; }
        .total-box { background: #10b981; color: white; padding: 12px; border-radius: 6px; text-align: center; margin-bottom: 10px; font-size: 16px; font-weight: bold; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .action-btn { padding: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-submit { background: #2563eb; color: white; width: 100%; font-size: 14px; letter-spacing: 0.5px; }
        .btn-submit:hover { background: #1d4ed8; }
        
        .btn-nav { background: #64748b; color: white; padding: 8px; border: none; border-radius: 4px; flex: 1; cursor: pointer; font-size: 13px; text-align: center; text-decoration: none; font-weight: 500; display: inline-block; }
        .btn-nav:hover { background: #475569; }
    </style>
</head>
<body>

    <div class="top-navbar">
        <h3>Subject: Advanced Evaluation Workspace</h3>
        <div class="meta-container">
            <div id="lockBanner" class="lock-status-banner">🔒 PERMANENTLY LOCKED</div>
            <div>
                BarCode No: <span class="barcode-badge" id="currentBarcode">{{ barcode }}</span>
            </div>
        </div>
    </div>

    <div class="osm-container" id="osmMainContainer" data-locked="{{ is_locked | safe }}">
        
        <div class="tool-sidebar">
            <span class="tool-label">Keys</span>
            <button class="circle-key" onclick="enterMark('1')">1</button>
            <button class="circle-key" onclick="enterMark('2')">2</button>
            <button class="circle-key" onclick="enterMark('3')">3</button>
            <button class="circle-key" onclick="enterMark('4')">4</button>
            <button class="circle-key" onclick="enterMark('5')">5</button>
            <button class="circle-key" onclick="enterMark('0')">0</button>
            <button class="circle-key clear-btn" onclick="resetAllMarks()">CLR</button>
        </div>

        <div class="pdf-viewer-container">
            <div class="pdf-canvas">
                <iframe src="{{ url_for('static', filename='answer_sheets/' + current_paper) }}#toolbar=0&navpanes=0" width="100%" height="100%" style="border: none;"></iframe>
            </div>
        </div>

        <div class="evaluation-panel">
            <div>
                <div class="panel-title">📋 Question Paper Marking Matrix</div>
                <div class="table-scroll">
                    <table class="marks-table">
                        <thead>
                            <tr>
                                <th>Q.No</th>
                                <th>Max (Edit)</th>
                                <th>Obtained</th>
                            </tr>
                        </thead>
                        <tbody id="evaluation-rows">
                            {% for q in structure %}
                            <tr id="row-{{ q.id }}">
                                <td><strong>{{ q.label }}</strong></td>
                                <td>
                                    <input type="number" id="max-{{ q.id }}" class="max-editable-input" value="{{ q.max }}" min="1" oninput="updateMaxLimitLive('{{ q.id }}')">
                                </td>
                                <td>
                                    <input type="number" id="{{ q.id }}" class="mark-input" min="0" max="{{ q.max }}" value="0" onfocus="setActiveQuestion('{{ q.id }}')" oninput="calculateLiveTotal()">
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="action-section">
                <div class="total-box">
                    Total Score: <span id="liveTotal">0</span> / <span id="liveMaxTotal">{{ total_max }}</span>
                </div>
                
                <div class="btn-grid">
                    <button class="action-btn" style="background: #ef4444; color: white;" onclick="alert('Paper Flagged as Rejected')">Reject</button>
                    <button class="action-btn" style="background: #f59f00; color: white;" onclick="alert('Paper Kept On Hold')">Hold</button>
                </div>
                
                <button class="action-btn btn-submit" id="submitBtn" onclick="submitMarksViaAJAX()">🔒 Final Save & Submit (1 Time Lock)</button>
                
                <button type="button" onclick="window.location.href='/download_excel'" style="width: 100%; padding: 10px; background: #10b981; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 13px; margin-top: 8px; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 4px 6px rgba(16,185,129,0.15);">
                    📊 Download Evaluation Report (Excel)
                </button>
                
                <div style="display: flex; gap: 10px; margin-top: 10px; justify-content: space-between;">
                    <a class="btn-nav" href="/?paper=sample.pdf">📄 Answer Sheet 1</a>
                    <a class="btn-nav" href="/?paper=student_02.pdf">📄 Answer Sheet 2</a>
                </div>
            </div>
        </div>

    </div>

    <script>
        let activeQuestionId = '';
        
        // 🔒 HTML ॲट्रिब्यूटमधून लॉक स्थिती सुरक्षितपणे मिळवणे (कोणतीही VS Code एरर येणार नाही)
        const mainContainer = document.getElementById('osmMainContainer');
        const isPageLocked = mainContainer ? (mainContainer.getAttribute('data-locked') === 'true') : false;

        function setActiveQuestion(qId) {
            if(isPageLocked) return;
            activeQuestionId = qId;
            document.querySelectorAll('.marks-table tbody tr').forEach(tr => tr.classList.remove('active-row'));
            let targetRow = document.getElementById('row-' + qId);
            if(targetRow) {
                targetRow.classList.add('active-row');
                targetRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function updateMaxLimitLive(qId) {
            let maxInputVal = document.getElementById('max-' + qId).value || 1;
            let targetMarkInput = document.getElementById(qId);
            targetMarkInput.setAttribute('max', maxInputVal);
            if (parseInt(targetMarkInput.value) > parseInt(maxInputVal)) { targetMarkInput.value = maxInputVal; }
            
            let grandMax = 0;
            document.querySelectorAll('.max-editable-input').forEach(input => { grandMax += parseInt(input.value) || 0; });
            document.getElementById('liveMaxTotal').innerText = grandMax;
            calculateLiveTotal();
        }

        function enterMark(num) {
            if(isPageLocked) return;
            if (activeQuestionId) {
                let targetInput = document.getElementById(activeQuestionId);
                let maxAllowed = parseInt(targetInput.getAttribute('max')) || 0;
                
                if (parseInt(num) <= maxAllowed) { targetInput.value = num; } 
                else { targetInput.value = maxAllowed; }
                
                calculateLiveTotal();
                
                let allInputs = Array.from(document.querySelectorAll('.mark-input'));
                let currentIndex = allInputs.indexOf(targetInput);
                if (currentIndex !== -1 && currentIndex < allInputs.length - 1) {
                    let nextInput = allInputs[currentIndex + 1];
                    nextInput.focus();
                    setActiveQuestion(nextInput.id);
                }
            }
        }

        function calculateLiveTotal() {
            let grandTotal = 0;
            document.querySelectorAll('.mark-input').forEach(input => { grandTotal += parseInt(input.value) || 0; });
            document.getElementById('liveTotal').innerText = grandTotal;
        }

        function resetAllMarks() {
            if(isPageLocked) return;
            document.querySelectorAll('.mark-input').forEach(input => input.value = 0);
            calculateLiveTotal();
        }

        function submitMarksViaAJAX() {
            if(isPageLocked) return;

            let scoresPayload = {};
            let maxLimitsPayload = {};
            document.querySelectorAll('.mark-input').forEach(input => { scoresPayload[input.id] = parseInt(input.value) || 0; });
            document.querySelectorAll('.max-editable-input').forEach(input => {
                let qId = input.id.replace('max-', '');
                maxLimitsPayload[qId] = parseInt(input.value) || 2;
            });
            
            let dataToSend = {
                barcode: document.getElementById('currentBarcode').innerText,
                paper: "{{ current_paper }}",
                scores: scoresPayload,
                max_limits: maxLimitsPayload
            };
            
            fetch('/submit_marks', {
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify(dataToSend)
            }).then(res => res.json()).then(data => {
                if(data.status === 'success') {
                    alert("🔒 पेपरमधील गुण आणि मॅक्स मार्क्स कायमचे सेव्ह झाले आहेत!");
                    location.reload();
                } else {
                    alert("❌ त्रुटी: " + data.message);
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            calculateLiveTotal();
            if(isPageLocked) {
                document.getElementById('lockBanner').style.display = 'block';
                document.getElementById('submitBtn').disabled = true;
                document.getElementById('submitBtn').style.background = '#94a3b8';
                document.getElementById('submitBtn').innerText = "🔒 Permanently Frozen";
                document.querySelectorAll('.mark-input').forEach(input => input.disabled = true);
                document.querySelectorAll('.max-editable-input').forEach(input => input.disabled = true);
            } else {
                let firstInput = document.querySelector('.mark-input');
                if(firstInput) { firstInput.focus(); setActiveQuestion(firstInput.id); }
            }
        });
    </script>
</body>
</html>
