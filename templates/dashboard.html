<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced OSM Hub - Digital Evaluation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body { background-color: #1a202c; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        .navbar-custom { background-color: #2d3748; padding: 10px 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* 🏗️ लेआउट ग्रिड डिझाईन */
        .sidebar-left { background-color: #2d3748; min-height: 92vh; padding: 15px 5px; }
        .sidebar-right { background-color: #ffffff; color: #333333; min-height: 92vh; padding: 20px 15px; border-left: 2px solid #cbd5e0; box-shadow: -4px 0 10px rgba(0,0,0,0.1); }
        
        /* 📄 मध्यभागी PDF स्क्रोलिंग कंटेनर */
        .pdf-viewer-container { background-color: #525659; height: 85vh; border-radius: 8px; border: 2px solid #4a5568; overflow-y: auto; overflow-x: hidden; padding: 10px; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); position: relative; }
        .pdf-page-wrapper { position: relative; margin-bottom: 20px; display: inline-block; background: white; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        canvas { display: block; max-width: 100%; height: auto; }
        
        /* 🖊️ स्टॅम्प आणि मार्किंग लेयर */
        .annotation-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; cursor: crosshair; }
        .digital-stamp { position: absolute; font-size: 24px; font-weight: bold; transform: translate(-50%, -50%); z-index: 10; pointer-events: none; user-select: none; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        
        /* 🔘 बटन्स स्टाईल */
        .btn-grade { width: 42%; margin: 4px; font-weight: bold; border-radius: 6px; padding: 6px; font-size: 13px; }
        .stamp-btn { width: 42%; margin: 4px; font-weight: bold; font-size: 15px; padding: 6px; }
        .stamp-btn.active, .btn-grade.active { border: 2px solid #3b82f6; box-shadow: 0 0 10px #3b82f6; }
        .score-box { background-color: #10b981; color: white; padding: 12px; border-radius: 8px; font-size: 18px; font-weight: bold; text-align: center; margin-top: 15px; }
        .form-control-sm, .form-select-sm { border-radius: 6px; border: 1px solid #cbd5e0; font-weight: 500; }
        
        /* 📊 मार्किंग मॅट्रिक्स यादी */
        .q-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; padding: 4px; border-bottom: 1px solid #edf2f7; }
        .q-label { font-weight: 600; font-size: 13px; color: #2d3748; width: 40%; }
        .q-max { font-size: 12px; color: #e53e3e; font-weight: bold; width: 20%; text-align: center; }
        .q-input { width: 35%; text-align: center; font-weight: bold; border-radius: 4px; border: 1px solid #cbd5e0; }
        .matrix-container { max-height: 42vh; overflow-y: auto; padding-right: 5px; border: 1px solid #e2e8f0; border-radius: 6px; background: #f7fafc; padding: 10px; }
    </style>
</head>
<body>

    <div class="navbar-custom d-flex justify-content-between align-items-center">
        <div>
            <span style="font-size: 11px; color: #a0aec0; display: block; font-weight: 600; text-transform: uppercase;">Subject Name:</span>
            <span id="display-subject" style="font-size: 16px; font-weight: bold; color: #f7fafc;">{{ subject_name }}</span>
