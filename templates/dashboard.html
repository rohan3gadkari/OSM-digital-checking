<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On-Screen Evaluation System</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        .container { display: flex; height: 100vh; }
        /* Left Side: PDF Viewer */
        .pdf-panel { width: 70%; border-right: 3px solid #333; background-color: #525659; }
        /* Right Side: Marking Sheet Panel */
        .marks-panel { width: 30%; padding: 25px; background-color: #f4f4f9; box-sizing: border-box; }
        .form-group { margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 12px; background-color: #2b7a78; color: white; border: none; font-size: 16px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background-color: #17252a; }
    </style>
</head>
<body>

<div class="container">
    <div class="pdf-panel">
        <iframe src="{{ url_for('static', filename='answer_sheets/' + paper_file) }}" width="100%" height="100%" style="border:none;"></iframe>
    </div>

    <div class="marks-panel">
        <h2>Test Series Marking Panel</h2>
        <hr><br>
        <form action="/submit_marks" method="POST">
            <div class="form-group">
                <label>Question 1 Marks (Max 10):</label>
                <input type="number" name="q1" min="0" max="10" required>
            </div>
            <div class="form-group">
                <label>Question 2 Marks (Max 10):</label>
                <input type="number" name="q2" min="0" max="10" required>
            </div>
            <br>
            <button type="submit">Submit Marks</button>
        </form>
    </div>
</div>

</body>
</html>
